[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcrl-benchmark"
version = "1.0.0"
description = "Graph-Enhanced Causal Reinforcement Learning for Proactive Customer Retention: A Comparative Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "torch>=2.0",
    "d3rlpy>=2.5,<3.0",
    "econml>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
gcrl = "gcrl.cli:main"

[tool.setuptools.packages.find]
include = ["gcrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = [
    "E501",   # line length is handled by the formatter
    # Y, T, X and A are the standard symbols for outcome, treatment, covariates
    # and the LinUCB design matrix. Lower-casing them to satisfy a naming rule
    # would make the causal and bandit code harder to read against its papers.
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
]

[tool.ruff.lint.per-file-ignores]
# Interface methods intentionally accept arguments they do not use (e.g. a
# stateless policy's fit), and tests define deliberately broken stubs.
"gcrl/models/rl.py" = ["ARG002"]
"tests/*" = ["ARG002", "ARG001"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
