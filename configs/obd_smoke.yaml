# =====================================================================
#  SMOKE TEST ONLY. These numbers are throwaway.
#
#  Purpose: prove the pipeline runs end to end -- every phase starts,
#  every artefact is written, every table is generated -- BEFORE
#  committing a night of GPU time to the real run.
#
#  It is deliberately tiny. It is not a small version of the experiment
#  and its output must never reach the paper. The paper's numbers come
#  from obd.yaml at the full 2,000,000 rows.
#
#  Expected wall-clock: a few minutes.
# =====================================================================
extends: obd.yaml
experiment_name: obd_smoke
dataset:
  subsample_rows: 20000
  chunk_size: 100000
gnn:
  architectures: [LightGCN, GCN]
  epochs: 3
  early_stopping_patience: 2
causal:
  estimators: [SLearner]
  primary_estimator: SLearner   # must be one of estimators above
  n_estimators: 10
  dragonnet_epochs: 3
rl:
  agents: [Random, DQN, BCQ]
  epochs: 3
  neuralucb_epochs: 2
ope:
  n_bootstrap: 10
  estimators: [snipw]
